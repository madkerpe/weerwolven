[project]
name = "weerwolven"
version = "0.1.0"
description = "Weerwolven van Wakkerdam met automatische verteller, lokaal op wifi"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "segno>=1.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weerwolven"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
